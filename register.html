<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Register — Marks Entry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF3E8;
    --paper-deep:#E4ECDC;
    --rule:#C6D3BC;
    --card:#FBFBF6;
    --ink:#1E2A38;
    --ink-soft:#55636F;
    --ink-faint:#8B978F;
    --red:#B4382C;
    --red-soft:#D9BDB6;
    --gold:#A3812E;
    --gold-soft:#E9DCB8;
    --green-ok:#3F6B4A;
    --blue-admin:#3A5A78;
    --shadow: 0 1px 2px rgba(30,42,56,0.06), 0 8px 24px rgba(30,42,56,0.08);
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .display{ font-family:'Fraunces', serif; }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  #app{ min-height:100vh; display:flex; flex-direction:column; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px; background:var(--card); border-bottom:1px solid var(--rule);
    box-shadow: var(--shadow); position:sticky; top:0; z-index:20; flex-wrap:wrap; gap:10px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:34px; height:34px; border-radius:50%; background:var(--ink); color:var(--paper);
    display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif;
    font-weight:600; font-size:17px; flex-shrink:0;
  }
  .brand-text{ line-height:1.1; }
  .brand-text .name{ font-family:'Fraunces',serif; font-weight:600; font-size:17px; }
  .brand-text .sub{ font-size:11px; color:var(--ink-faint); letter-spacing:.04em; text-transform:uppercase; }

  .topbar-right{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .who{ font-size:13px; color:var(--ink-soft); margin-right:4px; }
  .who b{ color:var(--ink); }
  .role-badge{
    font-size:10px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    padding:2px 7px; border-radius:20px; background:var(--gold-soft); color:#6b551f;
  }
  .role-badge.admin{ background:#DCE6EE; color:var(--blue-admin); }
  .iconbtn{
    border:1px solid var(--rule); background:var(--card); color:var(--ink-soft);
    border-radius:8px; padding:7px 12px; font-size:13px; cursor:pointer;
    display:flex; align-items:center; gap:6px; font-family:'IBM Plex Sans';
    transition: all .15s ease;
  }
  .iconbtn:hover{ background:var(--paper-deep); color:var(--ink); border-color:var(--ink-faint); }
  .iconbtn.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

  main{ flex:1; width:100%; }
  .wrap{ max-width:960px; margin:0 auto; padding:28px 20px 80px; }

  .login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    background:
      radial-gradient(circle at 20% 15%, rgba(163,129,46,0.07), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(180,56,44,0.05), transparent 45%),
      var(--paper);
  }
  .login-card{
    width:100%; max-width:380px; background:var(--card); border:1px solid var(--rule);
    border-radius:var(--radius); box-shadow:var(--shadow); padding:34px 32px 30px;
  }
  .login-mark{
    width:52px; height:52px; border-radius:50%; background:var(--ink); color:var(--paper);
    display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif;
    font-weight:600; font-size:26px; margin:0 auto 14px;
  }
  .login-title{ text-align:center; font-family:'Fraunces',serif; font-weight:600; font-size:24px; margin:0; }
  .login-sub{ text-align:center; color:var(--ink-faint); font-size:12.5px; letter-spacing:.03em; text-transform:uppercase; margin:4px 0 26px; }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:6px; font-weight:500; }
  .field input{
    width:100%; padding:11px 13px; border:1px solid var(--rule); border-radius:7px;
    font-family:'IBM Plex Sans'; font-size:14.5px; background:#fff; color:var(--ink);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .field input:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(163,129,46,0.15); }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:none; border-radius:8px; padding:12px 18px; font-size:14.5px; font-weight:600;
    cursor:pointer; font-family:'IBM Plex Sans'; transition: transform .08s ease, background .15s ease, opacity .15s ease;
  }
  .btn:active{ transform: scale(0.98); }
  .btn-primary{ background:var(--ink); color:var(--paper); width:100%; }
  .btn-primary:hover{ background:#2B3B4C; }
  .btn-primary:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--rule); }
  .btn-ghost:hover{ background:var(--paper-deep); }
  .btn-gold{ background:var(--gold); color:#fff; }
  .btn-gold:hover{ background:#8f7027; }
  .btn-red{ background:var(--red); color:#fff; }
  .btn-red:hover{ background:#932f25; }
  .btn-sm{ padding:7px 12px; font-size:12.5px; border-radius:6px; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  .login-error{
    background:rgba(180,56,44,0.08); border:1px solid var(--red-soft); color:var(--red);
    font-size:13px; padding:9px 12px; border-radius:7px; margin-bottom:14px; display:none;
  }
  .login-switch{ text-align:center; margin-top:18px; font-size:13px; color:var(--ink-faint); }
  .login-switch a{ color:var(--gold); cursor:pointer; text-decoration:none; font-weight:600; }
  .login-switch a:hover{ text-decoration:underline; }
  .demo-note{ margin-top:16px; font-size:11.5px; color:var(--ink-faint); text-align:center; line-height:1.5; }

  .step-title{ font-family:'Fraunces',serif; font-weight:600; font-size:15px; color:var(--ink-soft); margin:0 0 10px; letter-spacing:.02em; }
  .step-block{ margin-bottom:26px; }

  .tabrow{ display:flex; flex-wrap:wrap; gap:9px; }
  .tab{
    background:var(--card); border:1px solid var(--rule); border-radius:8px; padding:11px 16px;
    font-size:14px; font-weight:600; color:var(--ink-soft); cursor:pointer; transition: all .13s ease;
    font-family:'IBM Plex Sans'; display:flex; align-items:center; gap:8px;
  }
  .tab .cnt{ font-size:11px; font-weight:500; color:var(--ink-faint); background:var(--paper-deep); padding:2px 6px; border-radius:20px; }
  .tab:hover{ border-color:var(--ink-faint); color:var(--ink); }
  .tab.active{ background:var(--ink); border-color:var(--ink); color:var(--paper); }
  .tab.active .cnt{ background:rgba(255,255,255,0.15); color:var(--paper); }

  .ledger-card{ background:var(--card); border:1px solid var(--rule); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
  .ledger-head{
    display:flex; align-items:center; justify-content:space-between; padding:16px 20px;
    border-bottom:2px solid var(--ink); background:var(--paper-deep); flex-wrap:wrap; gap:10px;
  }
  .ledger-head h3{ margin:0; font-family:'Fraunces',serif; font-size:19px; font-weight:600; }
  .ledger-head .meta{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .maxmarks{ display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-soft); }
  .maxmarks input{
    width:56px; padding:5px 7px; border:1px solid var(--rule); border-radius:5px;
    font-family:'IBM Plex Mono'; font-size:13px; text-align:center;
  }

  .ledger-rows{
    background-image: repeating-linear-gradient(to bottom, transparent, transparent 55px, var(--rule) 56px);
  }
  .ledger-row{ display:grid; grid-template-columns:52px 1fr 130px; align-items:center; padding:0 20px; min-height:56px; gap:12px; }
  .ledger-row.with-audit{ grid-template-columns:44px 1fr 90px 170px; }
  .ledger-row .roll{ font-family:'IBM Plex Mono'; font-size:13px; color:var(--ink-faint); }
  .ledger-row .sname{ font-size:14.5px; font-weight:500; }
  .marks-input-wrap{ display:flex; align-items:center; gap:6px; justify-content:flex-end; }
  .marks-input{
    width:64px; padding:8px 9px; border:none; border-bottom:2px solid var(--rule); background:transparent;
    font-family:'IBM Plex Mono'; font-size:15px; font-weight:600; text-align:right; color:var(--red);
    transition:border-color .15s ease;
  }
  .marks-input:focus{ outline:none; border-color:var(--red); }
  .marks-input.filled{ border-color:var(--green-ok); }
  .marks-of{ font-size:12px; color:var(--ink-faint); font-family:'IBM Plex Mono'; }
  .audit-val{ font-family:'IBM Plex Mono'; font-size:14px; font-weight:600; text-align:right; color:var(--ink); }
  .audit-by{ font-size:11.5px; color:var(--ink-faint); text-align:right; line-height:1.4; }

  .ledger-footer{
    display:flex; align-items:center; justify-content:space-between; gap:14px; padding:16px 20px;
    border-top:1px solid var(--rule); background:var(--paper-deep); flex-wrap:wrap;
  }
  .save-status{ font-size:12.5px; color:var(--ink-faint); display:flex; align-items:center; gap:7px; }
  .stamp{
    display:none; align-items:center; gap:6px; color:var(--green-ok); font-weight:700; font-size:12.5px;
    letter-spacing:.04em; text-transform:uppercase; border:2px solid var(--green-ok); border-radius:6px;
    padding:4px 10px; transform:rotate(-3deg);
  }
  .stamp.show{ display:inline-flex; animation: stampin .25s ease; }
  @keyframes stampin{ from{ transform:rotate(-3deg) scale(1.4); opacity:0;} to{ transform:rotate(-3deg) scale(1); opacity:1;} }

  .empty-state{ text-align:center; padding:50px 24px; color:var(--ink-soft); }
  .empty-state .big{ font-family:'Fraunces',serif; font-size:19px; color:var(--ink); margin-bottom:8px; }
  .empty-state p{ font-size:13.5px; color:var(--ink-faint); max-width:380px; margin:0 auto 18px; line-height:1.6; }

  .settings-grid{ display:grid; grid-template-columns:1fr; gap:20px; }
  .panel{ background:var(--card); border:1px solid var(--rule); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px 22px; }
  .panel h3{ margin:0 0 4px; font-family:'Fraunces',serif; font-size:17px; }
  .panel .hint{ font-size:12.5px; color:var(--ink-faint); margin-bottom:16px; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .chip{
    display:flex; align-items:center; gap:8px; background:var(--paper-deep); border:1px solid var(--rule);
    border-radius:20px; padding:6px 8px 6px 14px; font-size:13px; font-weight:500;
  }
  .chip .x{ cursor:pointer; color:var(--ink-faint); width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; }
  .chip .x:hover{ background:var(--red); color:#fff; }
  .inline-add{ display:flex; gap:8px; flex-wrap:wrap; }
  .inline-add input{ flex:1; min-width:120px; padding:9px 12px; border:1px solid var(--rule); border-radius:7px; font-size:13.5px; font-family:'IBM Plex Sans'; }
  .inline-add input:focus{ outline:none; border-color:var(--gold); }

  .std-select-mini{ display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .std-select-mini select{ padding:8px 12px; border:1px solid var(--rule); border-radius:7px; font-size:13.5px; background:#fff; font-family:'IBM Plex Sans'; font-weight:600; }

  .student-list{ display:flex; flex-direction:column; gap:6px; }
  .student-row{ display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--rule); border-radius:7px; background:var(--paper-deep); }
  .student-row .roll{ font-family:'IBM Plex Mono'; font-size:12px; color:var(--ink-faint); width:26px; }
  .student-row .sname{ flex:1; font-size:13.5px; }
  .student-row .x{ cursor:pointer; color:var(--ink-faint); font-size:15px; padding:2px 6px; border-radius:5px; }
  .student-row .x:hover{ background:var(--red); color:#fff; }

  .subtle-note{ font-size:11.5px; color:var(--ink-faint); margin-top:6px; }

  textarea.bulk-area{
    width:100%; min-height:130px; padding:12px 13px; border:1px solid var(--rule); border-radius:7px;
    font-family:'IBM Plex Mono'; font-size:13px; resize:vertical; margin-bottom:10px;
  }
  textarea.bulk-area:focus{ outline:none; border-color:var(--gold); }
  .bulk-actions{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px; }

  .teacher-row{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border:1px solid var(--rule);
    border-radius:7px; background:var(--paper-deep); margin-bottom:6px; flex-wrap:wrap;
  }
  .teacher-row .tname{ font-weight:600; font-size:13.5px; flex:1; min-width:120px; }
  .teacher-row .tid{ font-size:11.5px; color:var(--ink-faint); font-family:'IBM Plex Mono'; }

  .overview-table{ width:100%; border-collapse:collapse; font-size:13px; }
  .overview-table th{ text-align:left; padding:9px 10px; border-bottom:2px solid var(--ink); font-family:'Fraunces',serif; font-size:13px; }
  .overview-table td{ padding:9px 10px; border-bottom:1px solid var(--rule); }
  .overview-table tr:hover td{ background:var(--paper-deep); cursor:pointer; }
  .prog-pill{
    font-family:'IBM Plex Mono'; font-size:12px; font-weight:600; padding:2px 8px; border-radius:20px;
    background:var(--paper-deep); color:var(--ink-soft); display:inline-block;
  }
  .prog-pill.complete{ background:#DCEADD; color:var(--green-ok); }
  .prog-pill.empty{ background:#F0ECE3; color:var(--ink-faint); }

  ::selection{ background: var(--gold-soft); }
  @media (max-width:520px){
    .wrap{ padding:20px 14px 70px; }
    .ledger-row{ grid-template-columns:36px 1fr 100px; padding:0 12px; }
    .ledger-row.with-audit{ grid-template-columns:30px 1fr 70px 110px; }
    .ledger-head, .ledger-footer{ padding:14px; }
  }
</style>
</head>

<script>
(function(){
  "use strict";

  /* ============ storage helpers ============ */
  async function sget(key, fallback){
    try{
      const r = await window.storage.get(key, true);
      return r ? JSON.parse(r.value) : fallback;
    }catch(e){ return fallback; }
  }
  async function sset(key, value){
    try{ await window.storage.set(key, JSON.stringify(value), true); }catch(e){ console.error("storage set failed", e); }
  }

  /* ============ state ============ */
  const state = {
    screen: 'loading',

    settingsStd: null,
    reportStd: null,
    reportSubject: null,
  };

  function mkey(std, subject){ return std + "|" + subject; }
  function isAdmin(){ return state.currentTeacher && state.currentTeacher.role === 'admin'; }
  function fmtDate(ts){
    if(!ts) return '';
    const d = new Date(ts);

  }

  /* ============ seed defaults ============ */
  async function loadAll(){

    }
    state.stds = await sget('stds', null);
    if(state.stds === null){
      state.stds = (window.__SEED_STDS__ && window.__SEED_STDS__.length) ? window.__SEED_STDS__.slice() : [];
      await sset('stds', state.stds);
    }
    state.subjectsByStd = await sget('subjectsByStd', null);
    if(state.subjectsByStd === null){
      state.subjectsByStd = {};
      state.stds.forEach(s => state.subjectsByStd[s] = (window.__SEED_SUBJECTS__ && window.__SEED_SUBJECTS__[s]) ? window.__SEED_SUBJECTS__[s].slice() : []);
      await sset('subjectsByStd', state.subjectsByStd);
    }
    state.studentsByStd = await sget('studentsByStd', null);
    if(state.studentsByStd === null){
      state.studentsByStd = {};
      state.stds.forEach(s => state.studentsByStd[s] = (window.__SEED_STUDENTS__ && window.__SEED_STUDENTS__[s]) ? window.__SEED_STUDENTS__[s].slice() : []);
      await sset('studentsByStd', state.studentsByStd);
    }
    state.maxMarks = await sget('maxMarks', {});
    state.marks = await sget('marks', {});
  }

  function renderLedger(std, subject){
    const students = (state.studentsByStd[std] || []).slice().sort((a,b) => (a.roll||0)-(b.roll||0));
    const key = mkey(std, subject);
    const max = state.maxMarks[key] || 100;
    const saved = state.marks[key] || {};

    if(students.length === 0){
      return `<div class="ledger-card">
        <div class="empty-state">
          <div class="big">No students in Class ${escapeHtml(std)} yet</div>
          <p>Paste the class list once in Settings and it's ready for every subject and every assessment after that.</p>
          <button class="btn btn-gold btn-sm" id="empty-goto-settings">Add students</button>
        </div>
      </div>`;
    }

    let rows = students.map(st => {
      const entry = saved[st.id];
      const val = entry ? entry.value : '';
      const filled = val !== '' ? 'filled' : '';
      return `<div class="ledger-row">
        <div class="roll">${st.roll ?? ''}</div>
        <div class="sname">${escapeHtml(st.name)}</div>
        <div class="marks-input-wrap">
          <input class="marks-input ${filled}" type="text" inputmode="decimal" data-student="${st.id}"
                 value="${val}" placeholder="—">
          <span class="marks-of">/ ${max}</span>
        </div>
      </div>`;
    }).join('');

    return `<div class="ledger-card">
      <div class="ledger-head">
        <div>
          <h3>Class ${escapeHtml(std)} · ${escapeHtml(subject)}</h3>
          <div class="meta">${students.length} student${students.length===1?'':'s'}</div>
        </div>
        <div class="maxmarks">
          Max marks
          <input type="number" id="maxmarks-input" min="1" value="${max}">
        </div>
      </div>
      <div class="ledger-rows">${rows}</div>
      <div class="ledger-footer">
        <div class="save-status" id="save-status">Marks save automatically as you type.</div>
        <div style="display:flex; align-items:center; gap:12px;">
          <div class="stamp" id="save-stamp">✓ Saved</div>
          <button class="btn btn-primary btn-sm" id="save-btn">Save marks</button>
        </div>
      </div>
    </div>`;
  }

  function attachPickerEvents(){
    document.querySelectorAll('[data-std]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.selectedStd = btn.getAttribute('data-std');
        state.selectedSubject = null;
        renderMain();
      });
    });
    document.querySelectorAll('[data-subject]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.selectedSubject = btn.getAttribute('data-subject');
        renderMain();
        focusFirstMarksInput();
      });
    });
    const emptyBtn = document.getElementById('empty-goto-settings');
    if(emptyBtn) emptyBtn.addEventListener('click', () => {
      state.view = 'settings'; state.settingsStd = state.selectedStd; renderMain();
    });

    const maxInput = document.getElementById('maxmarks-input');
    if(maxInput){
      maxInput.addEventListener('change', async () => {
        const key = mkey(state.selectedStd, state.selectedSubject);
        const v = parseInt(maxInput.value,10) || 100;
        state.maxMarks[key] = v;
        await sset('maxMarks', state.maxMarks);
        renderMain();
      });
    }

    const inputs = Array.from(document.querySelectorAll('.marks-input'));
    inputs.forEach((inp, idx) => {
      inp.addEventListener('input', () => {
        inp.value = inp.value.replace(/[^0-9.]/g, '');
        inp.classList.toggle('filled', inp.value !== '');
        markUnsaved();
      });
      inp.addEventListener('keydown', e => {
        if(e.key === 'Enter'){
          e.preventDefault();
          if(idx+1 < inputs.length) inputs[idx+1].focus(); else saveMarks();
        }
      });
    });

    const saveBtn = document.getElementById('save-btn');
    if(saveBtn) saveBtn.addEventListener('click', saveMarks);
  }

  function focusFirstMarksInput(){
    setTimeout(() => { const first = document.querySelector('.marks-input'); if(first) first.focus(); }, 30);
  }

  function markUnsaved(){
    const status = document.getElementById('save-status');
    if(status) status.textContent = 'Unsaved changes — press Enter or Save marks.';
    const stamp = document.getElementById('save-stamp');
    if(stamp) stamp.classList.remove('show');
  }

  async function saveMarks(){
    const key = mkey(state.selectedStd, state.selectedSubject);
    const existing = state.marks[key] || {};
    const obj = {};
    const now = Date.now();
    document.querySelectorAll('.marks-input').forEach(inp => {
      const sid = inp.getAttribute('data-student');
      if(inp.value !== ''){
        obj[sid] = {
          value: inp.value,
          enteredBy: state.currentTeacher.id,
          enteredByName: state.currentTeacher.name,
          at: now
        };
      }
    });
    state.marks[key] = obj;
    await sset('marks', state.marks);
    const status = document.getElementById('save-status');
    if(status) status.textContent = 'All marks saved.';
    const stamp = document.getElementById('save-stamp');
    if(stamp) stamp.classList.add('show');
  }

  function parseBulk(text){
    return text.split('\n').map(line => line.trim()).filter(Boolean).map((line, idx) => {
      const parts = line.split(/[,\t]/).map(p => p.trim()).filter(Boolean);
      let roll, name;
      if(parts.length >= 2 && /^\d+$/.test(parts[0])){
        roll = parseInt(parts[0],10);
        name = parts.slice(1).join(', ');
      } else {
        roll = idx + 1;
        name = parts.join(', ');
      }
      return { roll, name };
    }).filter(p => p.name);
  }

        const std = state.settingsStd;
        const id = el.getAttribute('data-del-student');
        state.studentsByStd[std] = (state.studentsByStd[std]||[]).filter(s => s.id !== id);
        await sset('studentsByStd', state.studentsByStd);
        renderMain();
      });
    });

    const bulkAddBtn = document.getElementById('bulk-add');
    if(bulkAddBtn) bulkAddBtn.addEventListener('click', async () => {
      const std = state.settingsStd;
      const text = document.getElementById('bulk-students').value;
      const parsed = parseBulk(text);
      if(parsed.length === 0) return;
      const existing = state.studentsByStd[std] || [];
      const existingNames = new Set(existing.map(s => s.name.toLowerCase()));
      parsed.forEach(p => {
        if(!existingNames.has(p.name.toLowerCase())){
          existing.push({ id: 'st_' + Date.now() + '_' + Math.random().toString(36).slice(2,7), name: p.name, roll: p.roll });
        }
      });
      state.studentsByStd[std] = existing;
      await sset('studentsByStd', state.studentsByStd);
      renderMain();
    });
    const bulkReplaceBtn = document.getElementById('bulk-replace');
    if(bulkReplaceBtn) bulkReplaceBtn.addEventListener('click', async () => {
      const std = state.settingsStd;
      const text = document.getElementById('bulk-students').value;
      const parsed = parseBulk(text);
      if(parsed.length === 0) return;
      if(!confirm(`Replace the entire student list for Class ${std} with ${parsed.length} students? This can't be undone.`)) return;
      state.studentsByStd[std] = parsed.map(p => ({ id: 'st_' + Date.now() + '_' + Math.random().toString(36).slice(2,7), name: p.name, roll: p.roll }));
      await sset('studentsByStd', state.studentsByStd);
      renderMain();
    });

    if(isAdmin()){
      document.querySelectorAll('[data-toggle-role]').forEach(el => {
        el.addEventListener('click', async () => {
          const id = el.getAttribute('data-toggle-role');
          const t = state.teachers.find(t => t.id === id);
          if(t) t.role = t.role === 'admin' ? 'teacher' : 'admin';
          await sset('teachers', state.teachers);
          renderMain();
        });
      });
      document.querySelectorAll('[data-del-teacher]').forEach(el => {
        el.addEventListener('click', async () => {
          const id = el.getAttribute('data-del-teacher');
          if(!confirm('Remove this teacher account?')) return;
          state.teachers = state.teachers.filter(t => t.id !== id);
          await sset('teachers', state.teachers);
          renderMain();
        });
      });
    }
  }

  /* ============ reports (admin only) ============ */
  function renderReports(){
    const std = state.reportStd || state.stds[0] || null;
    let html = `<div class="step-block">
      <div class="step-title">Overview — completion by class &amp; subject</div>
      <div class="panel" style="overflow:auto;">
        <table class="overview-table">
          <thead><tr><th>Class</th><th>Subject</th><th>Entered</th><th>Last activity</th></tr></thead>
          <tbody>`;
    let anyRow = false;
    state.stds.forEach(s => {
      const subs = state.subjectsByStd[s] || [];
      const total = (state.studentsByStd[s] || []).length;
      subs.forEach(sub => {
        anyRow = true;
        const key = mkey(s, sub);
        const entries = state.marks[key] || {};
        const count = Object.keys(entries).length;
        let last = 0, lastBy = '';
        Object.values(entries).forEach(e => { if(e.at > last){ last = e.at; lastBy = e.enteredByName; } });
        const pillClass = total > 0 && count === total ? 'complete' : (count === 0 ? 'empty' : '');
        html += `<tr data-rep-std="${escapeHtml(s)}" data-rep-subject="${escapeHtml(sub)}">
          <td>Class ${escapeHtml(s)}</td>
          <td>${escapeHtml(sub)}</td>
          <td><span class="prog-pill ${pillClass}">${count} / ${total}</span></td>
          <td>${last ? fmtDate(last) + ' by ' + escapeHtml(lastBy) : '—'}</td>
        </tr>`;
      });
    });
    if(!anyRow) html += `<tr><td colspan="4"><span class="subtle-note">No subjects set up yet.</span></td></tr>`;
    html += `</tbody></table></div></div>`;

    html += `<div class="step-block">
      <div class="step-title">Look up an entry — who entered what</div>
      <div class="tabrow">`;
    state.stds.forEach(s => {
      html += `<button class="tab ${state.reportStd===s?'active':''}" data-rstd="${escapeHtml(s)}">Class ${escapeHtml(s)}</button>`;
    });
    html += `</div></div>`;

    if(std){
      const subs = state.subjectsByStd[std] || [];
      html += `<div class="step-block"><div class="tabrow">`;
      subs.forEach(sub => {
        html += `<button class="tab ${state.reportSubject===sub?'active':''}" data-rsubject="${escapeHtml(sub)}">${escapeHtml(sub)}</button>`;
      });
      if(subs.length === 0) html += `<span class="subtle-note">No subjects for Class ${escapeHtml(std)}.</span>`;
      html += `</div></div>`;
    }

    if(std && state.reportSubject){
      html += renderAuditLedger(std, state.reportSubject);
    }

    return html;
  }

  function renderAuditLedger(std, subject){
    const students = (state.studentsByStd[std] || []).slice().sort((a,b) => (a.roll||0)-(b.roll||0));
    const key = mkey(std, subject);
    const max = state.maxMarks[key] || 100;
    const entries = state.marks[key] || {};

    if(students.length === 0){
      return `<div class="ledger-card"><div class="empty-state"><div class="big">No students in Class ${escapeHtml(std)}</div></div></div>`;
    }

    const rows = students.map(st => {
      const e = entries[st.id];
      return `<div class="ledger-row with-audit">
        <div class="roll">${st.roll ?? ''}</div>
        <div class="sname">${escapeHtml(st.name)}</div>
        <div class="audit-val">${e ? e.value + ' <span style="color:var(--ink-faint);font-weight:500;">/ ' + max + '</span>' : '<span style="color:var(--ink-faint);font-weight:500;">—</span>'}</div>
        <div class="audit-by">${e ? escapeHtml(e.enteredByName) + '<br>' + fmtDate(e.at) : '<span class="subtle-note">Not entered</span>'}</div>
      </div>`;
    }).join('');

    return `<div class="ledger-card">
      <div class="ledger-head">
        <div><h3>Class ${escapeHtml(std)} · ${escapeHtml(subject)}</h3><div class="meta">${students.length} student${students.length===1?'':'s'} · audit view</div></div>
      </div>
      <div class="ledger-rows">${rows}</div>
    </div>`;
  }

  function attachReportsEvents(){
    document.querySelectorAll('[data-rep-std]').forEach(row => {
      row.addEventListener('click', () => {
        state.reportStd = row.getAttribute('data-rep-std');
        state.reportSubject = row.getAttribute('data-rep-subject');
        renderMain();
      });
    });
    document.querySelectorAll('[data-rstd]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.reportStd = btn.getAttribute('data-rstd');
        state.reportSubject = null;
        renderMain();
      });
    });
    document.querySelectorAll('[data-rsubject]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.reportSubject = btn.getAttribute('data-rsubject');
        renderMain();
      });
    });
  }

  /* ============ utils ============ */
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  /* ============ boot ============ */
  (async function boot(){
    render();
    await loadAll();
    state.screen = 'login';
    render();
  })();

})();
</script>
</body>
</html>
